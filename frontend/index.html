<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG API Frontend</title>
    <script src="tailwind.config.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">RAG API Control Panel</h1>

            <div class="section mb-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">System Status</h2>
                <div id="status-container" class="bg-gray-50 p-4 rounded-lg text-sm"></div>
            </div>

            <div class="section mb-6">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Upload Document</h2>
                <div class="flex items-center space-x-2">
                    <input type="file" id="file-input" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    <button id="upload-button" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">Upload</button>
                </div>
            </div>

            <div class="section">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Documents</h2>
                <ul id="documents-list" class="space-y-2"></ul>
            </div>
        </div>

        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Chat</h2>
            <div id="chat-container" class="flex flex-col h-[calc(100vh-200px)]">
                <div id="chat-history" class="flex-1 p-4 bg-gray-50 rounded-lg overflow-y-auto mb-4"></div>
                <div class="flex items-center">
                    <input type="text" id="chat-input" placeholder="Ask a question..." class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="chat-button" class="bg-blue-600 text-white px-6 py-3 rounded-lg ml-4 hover:bg-blue-700 transition">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
